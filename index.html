<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CRUDO</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Space+Grotesk:wght@400;500;600;700&display=swap');

  :root{
    --paper:#EFF0E9;
    --card:#F7F6F0;
    --ink:#211F1A;
    --ink-soft:#5C594F;
    --line:#DAD7CC;
    --olive:#4E5A38;
    --olive-dark:#3B4429;
    --denim:#4C6272;

    --sw-oliva:#6B7048;
    --sw-crema:#E4DCC8;
    --sw-denim:#4C6272;
    --sw-camel:#B58A5D;
    --sw-negro:#2B2A26;
    --sw-gris:#A8A69C;
    --sw-terracota:#A85C3B;
    --sw-blanco:#EDE9DE;
    --sw-burdeos:#723A3D;
    --sw-botella:#2F4A3C;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Space Grotesk',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button{ font:inherit; border:none; background:none; cursor:pointer; padding:0; color:inherit; }
  input[type="checkbox"], input[type="radio"]{ accent-color:var(--olive); }
  a{ color:inherit; }
  .serif{ font-family:'Fraunces',Georgia,serif; }
  .sans{ font-family:'Space Grotesk',sans-serif; }

  /* ---------- HEADER ---------- */
  header.topbar{
    position:sticky; top:0; z-index:20;
    background:var(--paper);
  }
  .topbar-row{
    display:flex; align-items:center; justify-content:space-between;
    height:56px; padding:0 16px; border-bottom:1px solid var(--line);
  }
  .logo{ font-family:'Fraunces',serif; font-size:22px; letter-spacing:-0.02em; }
  .icon-btn{ position:relative; display:flex; align-items:center; justify-content:center; }
  .cart-badge{
    position:absolute; top:-8px; right:-8px;
    width:17px; height:17px; border-radius:999px;
    background:var(--olive); color:var(--paper);
    font-size:10px; display:flex; align-items:center; justify-content:center;
  }
  .subheader{
    display:none; align-items:center; gap:8px; height:44px; padding:0 16px;
  }
  .subheader.show{ display:flex; }
  .subheader span{ font-size:14px; font-weight:500; }

  /* ---------- HERO ---------- */
  .hero{
    position:relative; width:100%; height:220px; overflow:hidden;
    text-align:left; display:block;
  }
  .hero::before{
    content:""; position:absolute; inset:0;
    background-image:repeating-linear-gradient(115deg, rgba(255,255,255,0.07) 0px, rgba(255,255,255,0.07) 2px, transparent 2px, transparent 26px);
  }
  .hero-content{
    position:absolute; inset:0; display:flex; flex-direction:column; justify-content:flex-end; padding:20px;
  }
  .hero.flip .hero-content{ align-items:flex-end; text-align:right; }
  .hero-sub{ color:rgba(244,242,234,0.75); font-size:12px; margin-bottom:4px; }
  .hero-label{ font-family:'Fraunces',serif; font-style:italic; color:#F4F2EA; font-size:38px; line-height:1; }
  .hero-cta{ color:#F4F2EA; font-size:12px; margin-top:8px; text-decoration:underline; text-underline-offset:4px; }

  /* ---------- SECTION HEADS ---------- */
  .section-head{ padding:32px 16px 8px; }
  .section-head h2{ font-family:'Fraunces',serif; font-size:30px; margin:0; }
  .section-head p{ color:var(--ink-soft); font-size:14px; margin:6px 0 0; }

  /* ---------- PRODUCT GRID ---------- */
  .grid{
    padding:0 16px; display:grid; grid-template-columns:repeat(2,1fr);
    gap:22px 12px;
  }
  @media(min-width:640px){ .grid{ grid-template-columns:repeat(3,1fr); gap:24px 16px; } }
  @media(max-width:639px){ .grid-extra{ display:none; } }

  .product-card{ display:flex; flex-direction:column; }
  .product-image-frame{
    background:var(--card); border:1px solid var(--line); border-radius:8px;
    padding:7px; cursor:pointer;
  }
  @media(min-width:640px){ .product-image-frame{ padding:12px; } }
  .product-image{
    position:relative; width:100%; aspect-ratio:3/4; border-radius:4px; overflow:hidden;
  }
  .product-image .shirt-icon{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center; opacity:0.55;
  }
  .product-info{ padding-top:8px; }
  .product-name{ font-size:14px; font-weight:500; line-height:1.3; margin:0; }
  .product-price{ font-size:14px; font-weight:700; color:var(--olive-dark); margin:2px 0 0; }
  .add-btn{
    display:block; width:100%; margin-top:8px; padding:8px 0; border-radius:999px;
    background:var(--olive); color:var(--paper); font-size:12px; font-weight:600; text-align:center;
  }

  /* ---------- VER MAS ---------- */
  .vermas-wrap{ display:flex; justify-content:center; padding:32px 0; }
  .btn-pill{
    padding:12px 32px; border-radius:999px; background:var(--olive); color:var(--paper);
    font-weight:600; font-size:14px;
  }
  .btn-pill:disabled{ background:var(--line); color:var(--ink-soft); }

  /* ---------- FOOTER ---------- */
  footer{ padding:32px 20px; background:var(--card); border-top:1px solid var(--line); }
  .footer-row{ display:flex; justify-content:space-between; gap:20px; align-items:flex-start; }
  footer .foot-logo{ font-family:'Fraunces',serif; font-size:26px; margin:0 0 16px; }
  footer .foot-label{ color:var(--ink-soft); font-size:12px; margin:0 0 8px; }
  .social-row{ display:flex; gap:8px; }
  .social-sq{
    width:34px; height:34px; border-radius:6px; background:var(--ink); color:var(--paper);
    display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700;
  }
  .legal-list{ display:flex; flex-direction:column; gap:6px; text-align:right; flex-shrink:0; }
  .legal-list span{ color:var(--ink-soft); font-size:14px; }

  /* ---------- PRODUCT DETAIL ---------- */
  .detail-wrap{ padding:20px 16px 48px; }
  @media(min-width:640px){
    .detail-wrap{ display:flex; gap:36px; align-items:flex-start; }
    .detail-image-col{ flex:1; max-width:420px; }
    .detail-info-col{ flex:1; padding-top:6px; }
  }
  .detail-image-frame{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .detail-image{ position:relative; width:100%; aspect-ratio:3/4; border-radius:6px; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .detail-meta{ color:var(--ink-soft); font-size:13px; margin:20px 0 6px; letter-spacing:0.02em; }
  @media(min-width:640px){ .detail-meta{ margin-top:0; } }
  .detail-name{ font-family:'Fraunces',serif; font-size:28px; margin:0 0 10px; line-height:1.15; }
  .detail-price{ font-size:20px; font-weight:700; color:var(--olive-dark); margin:0 0 18px; }
  .detail-desc{ font-size:14px; color:var(--ink-soft); line-height:1.65; margin:0 0 26px; max-width:46ch; }
  .detail-add-btn{ width:100%; padding:14px 0; }
  @media(min-width:640px){ .detail-add-btn{ width:auto; padding:14px 36px; } }

  /* ---------- CATALOG ---------- */
  .catalog-wrap{ padding:16px 16px 40px; }
  .catalog-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .catalog-top .count{ color:var(--ink-soft); font-size:14px; }
  .filter-toggle{ display:flex; align-items:center; gap:6px; font-size:14px; }
  .catalog-body{ display:flex; flex-direction:column; gap:24px; }
  @media(min-width:640px){ .catalog-body{ flex-direction:row; } }

  .filters{ padding-bottom:24px; border-bottom:1px solid var(--line); }
  @media(min-width:640px){
    .filters{ width:190px; flex-shrink:0; padding-bottom:0; border-bottom:none; border-right:1px solid var(--line); padding-right:20px; }
  }
  .filters.hidden{ display:none; }
  .filter-title{ font-size:14px; font-weight:600; margin:0 0 8px; }
  .filter-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:24px; }
  .filter-list label{ display:flex; align-items:center; gap:8px; font-size:14px; }
  .clear-filters{ font-size:14px; color:var(--ink-soft); text-decoration:underline; text-underline-offset:4px; }
  .catalog-results{ flex:1; }
  .empty-msg{ color:var(--ink-soft); font-size:14px; text-align:center; padding:40px 0; }

  /* ---------- CHECKOUT ---------- */
  .checkout-wrap{ padding:24px 16px; }
  .checkout-body{ display:flex; flex-direction:column; gap:32px; }
  @media(min-width:640px){ .checkout-body{ flex-direction:row; } }
  .checkout-form{ flex:1; display:flex; flex-direction:column; gap:12px; }
  .checkout-form h3{ font-family:'Fraunces',serif; font-size:20px; margin:4px 0; font-weight:400; }
  .field{ display:flex; flex-direction:column; gap:4px; }
  .field span{ color:var(--ink-soft); font-size:12px; }
  .field input{
    padding:10px 12px; border-radius:6px; border:1px solid var(--line);
    background:var(--card); color:var(--ink); font-family:'Space Grotesk',sans-serif; outline:none;
  }
  .radio-row{ display:flex; flex-direction:column; gap:8px; }
  .radio-row label{ display:flex; align-items:center; gap:8px; font-size:14px; }
  .payment-note{
    background:var(--card); border:1px solid var(--line); border-radius:8px;
    padding:12px 14px; font-size:13px; color:var(--ink-soft); line-height:1.5;
  }
  .payment-note strong{ color:var(--ink); }
  .checkout-summary{ flex-shrink:0; }
  @media(min-width:640px){ .checkout-summary{ width:280px; } }
  .summary-card{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .summary-card h4{ font-family:'Fraunces',serif; font-weight:400; font-size:18px; margin:0 0 12px; }
  .summary-line{ display:flex; justify-content:space-between; font-size:14px; margin-bottom:10px; gap:8px; }
  .summary-line .muted{ color:var(--ink-soft); }
  .summary-total{ border-top:1px solid var(--line); padding-top:12px; margin-top:4px; display:flex; flex-direction:column; gap:6px; }
  .summary-total .row{ display:flex; justify-content:space-between; font-size:14px; }
  .summary-total .row.big{ font-size:16px; font-weight:700; padding-top:4px; }

  .checkout-done{ padding:60px 24px; text-align:center; display:flex; flex-direction:column; align-items:center; }
  .done-icon{ width:56px; height:56px; border-radius:999px; background:var(--olive); display:flex; align-items:center; justify-content:center; margin-bottom:16px; }
  .checkout-done h2{ font-family:'Fraunces',serif; font-size:24px; margin:0 0 8px; }
  .checkout-done p{ color:var(--ink-soft); font-size:14px; margin:0 0 20px; }
  .bank-info-card{
    width:100%; max-width:360px; background:var(--card); border:1px solid var(--line);
    border-radius:10px; padding:16px; margin:4px 0 16px; text-align:left;
  }
  .bank-info-title{ font-family:'Fraunces',serif; font-size:16px; margin:0 0 10px; }
  .bank-row{ display:flex; justify-content:space-between; gap:12px; font-size:13px; padding:6px 0; border-bottom:1px solid var(--line); }
  .bank-row:last-child{ border-bottom:none; }
  .bank-row span:first-child{ color:var(--ink-soft); }
  .bank-row span:last-child{ font-weight:600; text-align:right; }
  .phone-note{ font-size:13px; color:var(--ink-soft); margin:0 0 24px; max-width:340px; }

  /* ---------- DRAWERS ---------- */
  .drawer-overlay{
    position:fixed; inset:0; z-index:40; pointer-events:none;
  }
  .drawer-overlay.open{ pointer-events:auto; }
  .drawer-scrim{
    position:absolute; inset:0; background:rgba(33,31,26,0.45); opacity:0; transition:opacity .25s ease;
  }
  .drawer-overlay.open .drawer-scrim{ opacity:1; }

  .drawer-panel{
    position:absolute; top:0; height:100%; overflow-y:auto;
    background:#fff; transition:transform .3s ease;
  }
  #menu-drawer .drawer-panel{ left:0; width:86%; max-width:340px; transform:translateX(-100%); }
  #menu-drawer.open .drawer-panel{ transform:translateX(0); }

  #cart-drawer .drawer-panel{
    right:0; width:88%; max-width:360px; transform:translateX(100%);
    background:var(--paper); display:flex; flex-direction:column;
  }
  #cart-drawer.open .drawer-panel{ transform:translateX(0); }

  .drawer-close-row{ display:flex; justify-content:flex-end; padding:24px 24px 0; }
  .menu-body{ padding:8px 24px 32px; }
  .menu-head{ font-size:18px; font-weight:700; margin:0 0 8px; }
  .menu-rule{ border-bottom:1px solid var(--line); margin-bottom:12px; }
  .menu-list{ display:flex; flex-direction:column; margin-bottom:32px; }
  .menu-list button, .menu-list span{ text-align:left; padding:8px 0; font-size:16px; }

  .cart-drawer-head{
    display:flex; align-items:center; justify-content:space-between;
    height:56px; padding:0 20px; border-bottom:1px solid var(--line); flex-shrink:0;
  }
  .cart-drawer-head span{ font-family:'Fraunces',serif; font-size:18px; }
  .cart-empty{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0 24px; }
  .cart-empty p{ color:var(--ink-soft); font-size:14px; margin-top:12px; }
  .cart-items{ flex:1; overflow-y:auto; padding:0 20px; }
  .cart-item{ display:flex; gap:12px; padding:16px 0; border-bottom:1px solid var(--line); }
  .cart-item:last-child{ border-bottom:none; }
  .cart-item-swatch{ width:56px; height:68px; border-radius:6px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .cart-item-body{ flex:1; min-width:0; }
  .cart-item-name{ font-size:14px; font-weight:500; margin:0; line-height:1.3; }
  .cart-item-price{ font-size:14px; font-weight:700; color:var(--olive-dark); margin:2px 0 0; }
  .qty-row{ display:flex; align-items:center; gap:10px; margin-top:8px; }
  .qty-btn{ width:24px; height:24px; border-radius:999px; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; }
  .qty-row .remove-btn{ margin-left:auto; }
  .cart-drawer-foot{ padding:16px 20px; border-top:1px solid var(--line); flex-shrink:0; }
  .cart-subtotal-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .cart-subtotal-row span:first-child{ color:var(--ink-soft); font-size:14px; }
  .cart-subtotal-row span:last-child{ font-size:16px; font-weight:700; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-row">
    <button class="icon-btn" id="btn-menu" aria-label="Abrir menú">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M3 12h18M3 18h18" stroke="#211F1A" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <button class="logo" id="btn-logo" aria-label="Ir al inicio">CRUDO</button>
    <button class="icon-btn" id="btn-cart" aria-label="Abrir carrito">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M6 8h12l-1 12.5a1 1 0 0 1-1 .9H8a1 1 0 0 1-1-.9L6 8Z" stroke="#211F1A" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 8V6a3 3 0 0 1 6 0v2" stroke="#211F1A" stroke-width="1.6"/></svg>
      <span class="cart-badge" id="cart-badge" style="display:none;">0</span>
    </button>
  </div>
  <div class="subheader" id="subheader">
    <button id="btn-back" aria-label="Volver" style="display:flex;align-items:center;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M19 12H5M11 6l-6 6 6 6" stroke="#5C594F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <span id="subheader-title"></span>
  </div>
</header>

<main id="main-content"></main>

<!-- MENU DRAWER -->
<div class="drawer-overlay" id="menu-drawer">
  <div class="drawer-scrim" id="menu-scrim"></div>
  <div class="drawer-panel">
    <div class="drawer-close-row">
      <button id="btn-menu-close" aria-label="Cerrar menú">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="#211F1A" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="menu-body">
      <p class="menu-head serif" style="font-family:'Space Grotesk',sans-serif;">Prendas</p>
      <div class="menu-rule"></div>
      <div class="menu-list" id="menu-categories"></div>

      <p class="menu-head">Tipo</p>
      <div class="menu-rule"></div>
      <div class="menu-list" id="menu-genders"></div>

      <p class="menu-head">Legal</p>
      <div class="menu-rule"></div>
      <div class="menu-list" id="menu-legal"></div>
    </div>
  </div>
</div>

<!-- CART DRAWER -->
<div class="drawer-overlay" id="cart-drawer">
  <div class="drawer-scrim" id="cart-scrim"></div>
  <div class="drawer-panel">
    <div class="cart-drawer-head">
      <span>Tu carrito</span>
      <button id="btn-cart-close" aria-label="Cerrar carrito">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="#211F1A" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="cart-body"></div>
    <div class="cart-drawer-foot">
      <div class="cart-subtotal-row">
        <span>Subtotal</span>
        <span id="cart-subtotal">$0</span>
      </div>
      <button class="btn-pill" style="width:100%;" id="btn-checkout" disabled>Finalizar compra</button>
    </div>
  </div>
</div>

const LEGAL_LINKS = ["Políticas de Privacidad","Políticas de Cambio","Políticas de Devolución","Contacto"];

// Datos del comercio para transferencia — reemplazar por los reales antes de publicar
const BANK_INFO = {
  titular: "Crudo Indumentaria SRL",
  banco: "Banco Ejemplo",
  alias: "CRUDO.TIENDA.MP",
  cbu: "0000003100000000000000",
};
const STORE_PHONE = "+54 9 11 0000-0000"; // reemplazar por el teléfono real del comercio

// Configuración de EmailJS para el envío automático del correo de confirmación.
// Creá una cuenta gratis en https://www.emailjs.com, armá un service + template,
// y pegá tus IDs acá. Mientras diga "TU_..." el envío se salteá sin romper la compra.
const EMAILJS_CONFIG = {
  serviceId: "TU_SERVICE_ID",
  templateId: "TU_TEMPLATE_ID",
  publicKey: "TU_PUBLIC_KEY",
};

/* ============ STATE ============ */
let view = "home";
let cart = {};                 // id -> qty
let filters = { gender:new Set(), category:new Set() };
let filtersVisible = true;
let currentProductId = null;

/* ============ HELPERS ============ */
const money = n => "$" + n.toLocaleString("es-AR",{maximumFractionDigits:0});
const findProduct = id => PRODUCTS.find(p => p.id === Number(id));
const lightTones = new Set(["crema","blanco","gris"]);
const TONE_LABEL = {
  oliva:"oliva", crema:"crema", denim:"denim", camel:"camel", negro:"negro",
  gris:"gris", terracota:"terracota", blanco:"blanco roto", burdeos:"burdeos", botella:"verde botella"
};

function shirtSVG(tone){
  const color = lightTones.has(tone) ? "#211F1A" : "#F4F2EA";
  return `<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="1.1"><path d="M8 4 4 7v3h2v9h12v-9h2V7l-4-3-2 2h-4L8 4Z" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
function cartItemsArray(){
  return Object.entries(cart).map(([id,qty]) => ({p:findProduct(id), qty})).filter(x=>x.p);
}
function cartCount(){ return cartItemsArray().reduce((s,i)=>s+i.qty,0); }
function cartSubtotal(){ return cartItemsArray().reduce((s,i)=>s+i.p.price*i.qty,0); }

function generateOrderNumber(){
  return Math.floor(10000 + Math.random()*89999);
}

async function sendConfirmationEmail(order){
  if(typeof emailjs === "undefined"){
    console.warn("EmailJS no cargó (sin conexión a internet). No se pudo enviar el correo.");
    return;
  }
  if(EMAILJS_CONFIG.serviceId.startsWith("TU_")){
    console.warn("Falta configurar EMAILJS_CONFIG con tus datos reales de EmailJS: el correo automático no se envía todavía.");
    return;
  }
  try{
    await emailjs.send(EMAILJS_CONFIG.serviceId, EMAILJS_CONFIG.templateId, {
      to_email: order.email,
      to_name: order.name,
      order_number: order.number,
      order_items: order.itemsText,
      order_total: order.totalText,
      shipping_address: order.address,
      shipping_city: order.city,
      shipping_zip: order.zip,
      bank_titular: BANK_INFO.titular,
      bank_banco: BANK_INFO.banco,
      bank_alias: BANK_INFO.alias,
      bank_cbu: BANK_INFO.cbu,
      store_phone: STORE_PHONE,
    }, EMAILJS_CONFIG.publicKey);
  }catch(err){
    console.error("No se pudo enviar el correo de confirmación:", err);
  }
}

/* ============ PRODUCT CARD ============ */
function productCardHTML(p, extraClass){
  return `
  <div class="product-card ${extraClass||""}">
    <div class="product-image-frame" onclick="goProduct(${p.id})" role="button" tabindex="0" aria-label="Ver ${p.name}">
      <div class="product-image" style="background-color:var(--sw-${p.tone})">
        <div class="shirt-icon">${shirtSVG(p.tone)}</div>
      </div>
    </div>
    <div class="product-info">
      <p class="product-name">${p.name}</p>
      <p class="product-price">${money(p.price)}</p>
      <button class="add-btn" onclick="event.stopPropagation(); addToCart(${p.id})">Agregar al carrito</button>
    </div>
  </div>`;
}

/* ============ CART ACTIONS ============ */
function addToCart(id){
  cart[id] = (cart[id]||0) + 1;
  refreshCartUI();
}
function changeQty(id, delta){
  const next = (cart[id]||0) + delta;
  if(next <= 0) delete cart[id]; else cart[id] = next;
  refreshCartUI();
}
function removeFromCart(id){
  delete cart[id];
  refreshCartUI();
}
function refreshCartUI(){
  const count = cartCount();
  const badge = document.getElementById("cart-badge");
  badge.textContent = count;
  badge.style.display = count > 0 ? "flex" : "none";
  renderCartDrawer();
  if(view === "checkout") renderCheckout();
}

/* ============ CART DRAWER ============ */
function renderCartDrawer(){
  const items = cartItemsArray();
  const body = document.getElementById("cart-body");
  if(items.length === 0){
    body.innerHTML = `
      <div class="cart-empty">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M6 8h12l-1 12.5a1 1 0 0 1-1 .9H8a1 1 0 0 1-1-.9L6 8Z" stroke="#5C594F" stroke-width="1.6"/><path d="M9 8V6a3 3 0 0 1 6 0v2" stroke="#5C594F" stroke-width="1.6"/></svg>
        <p>Todavía no agregaste nada. Elegí una prenda y sumala al carrito.</p>
      </div>`;
  } else {
    body.innerHTML = `<div class="cart-items">` + items.map(({p,qty}) => `
      <div class="cart-item">
        <div class="cart-item-swatch" style="background-color:var(--sw-${p.tone})">${shirtSVG(p.tone)}</div>
        <div class="cart-item-body">
          <p class="cart-item-name">${p.name}</p>
          <p class="cart-item-price">${money(p.price)}</p>
          <div class="qty-row">
            <button class="qty-btn" onclick="changeQty(${p.id},-1)">
              <svg width="12" height="12" viewBox="0 0 24 24"><path d="M5 12h14" stroke="#211F1A" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
            <span>${qty}</span>
            <button class="qty-btn" onclick="changeQty(${p.id},1)">
              <svg width="12" height="12" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="#211F1A" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
            <button class="remove-btn" onclick="removeFromCart(${p.id})" aria-label="Quitar">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2m-8 0 1 13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1l1-13" stroke="#5C594F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
      </div>`).join("") + `</div>`;
  }
  document.getElementById("cart-subtotal").textContent = money(cartSubtotal());
  document.getElementById("btn-checkout").disabled = items.length === 0;
}

/* ============ DRAWER OPEN/CLOSE ============ */
function openMenu(){ document.getElementById("menu-drawer").classList.add("open"); }
function closeMenu(){ document.getElementById("menu-drawer").classList.remove("open"); }
function openCart(){ document.getElementById("cart-drawer").classList.add("open"); }
function closeCart(){ document.getElementById("cart-drawer").classList.remove("open"); }

document.getElementById("btn-menu").onclick = openMenu;
document.getElementById("btn-menu-close").onclick = closeMenu;
document.getElementById("menu-scrim").onclick = closeMenu;
document.getElementById("btn-cart").onclick = openCart;
document.getElementById("btn-cart-close").onclick = closeCart;
document.getElementById("cart-scrim").onclick = closeCart;
document.getElementById("btn-checkout").onclick = () => {
  if(cartCount() === 0) return;
  closeCart();
  goView("checkout");
};
document.getElementById("btn-logo").onclick = () => goView("home");
document.getElementById("btn-back").onclick = () => window.history.back();

/* ============ MENU DRAWER CONTENT ============ */
function renderMenuLists(){
  document.getElementById("menu-categories").innerHTML = CATEGORIES.map(c =>
    `<button onclick="goCatalog({category:'${c}'})">${c}</button>`).join("");
  document.getElementById("menu-genders").innerHTML = GENDERS.map(g =>
    `<button onclick="goCatalog({gender:'${g}'})">${g}</button>`).join("");
  document.getElementById("menu-legal").innerHTML = LEGAL_LINKS.map(l =>
    `<span>${l}</span>`).join("");
}

/* ============ ROUTING (hash-based, con historial real) ============ */
function serializeFilters(){
  const params = new URLSearchParams();
  if(filters.gender.size) params.set("genero", Array.from(filters.gender).join(","));
  if(filters.category.size) params.set("prenda", Array.from(filters.category).join(","));
  const qs = params.toString();
  return qs ? ("?" + qs) : "";
}
function parseFiltersFromParams(params){
  const g = params.get("genero");
  const c = params.get("prenda");
  filters.gender = new Set(g ? g.split(",") : []);
  filters.category = new Set(c ? c.split(",") : []);
}
function navigateTo(hash){
  if(window.location.hash === hash) handleHashChange();
  else window.location.hash = hash;
}
function goCatalog({gender, category}){
  filters.gender = new Set(gender ? [gender] : []);
  filters.category = new Set(category ? [category] : []);
  closeMenu();
  navigateTo("#/catalogo" + serializeFilters());
}
function goProduct(id){
  navigateTo("#/producto/" + id);
}
function goView(next){
  const map = { home:"#/", catalog:"#/catalogo" + serializeFilters(), checkout:"#/checkout" };
  navigateTo(map[next] || "#/");
}
function clearFilters(){
  filters.gender = new Set();
  filters.category = new Set();
  navigateTo("#/catalogo");
}
function handleHashChange(){
  const raw = window.location.hash.slice(1);
  const clean = raw.startsWith("/") ? raw.slice(1) : raw;
  const [path, query] = clean.split("?");
  const params = new URLSearchParams(query || "");

  if(!path){
    view = "home";
  } else if(path === "catalogo"){
    view = "catalog";
    parseFiltersFromParams(params);
  } else if(path.startsWith("producto/")){
    view = "product";
    currentProductId = Number(path.split("/")[1]);
  } else if(path === "checkout"){
    view = "checkout";
  } else {
    view = "home";
  }
  render();
  window.scrollTo(0,0);
}

/* ============ RENDER: CATALOG ============ */
function catalogResults(){
  return PRODUCTS.filter(p => {
    const gOk = filters.gender.size === 0 || filters.gender.has(p.gender);
    const cOk = filters.category.size === 0 || filters.category.has(p.category);
    return gOk && cOk;
  });
}
function renderCatalog(){
  return `
    <div class="catalog-wrap">
      <div class="catalog-top">
        <span class="count" id="catalog-count"></span>
        <button class="filter-toggle" onclick="toggleFilters()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M7 12h10M10 18h4" stroke="#211F1A" stroke-width="1.6" stroke-linecap="round"/></svg>
          Filtros
        </button>
      </div>
      <div class="catalog-body">
        <aside class="filters" id="catalog-filters">
          <p class="filter-title">Género</p>
          <div class="filter-list">${GENDERS.map(g => `
            <label><input type="checkbox" data-type="gender" data-value="${g}" onchange="toggleFilter('gender','${g}')" ${filters.gender.has(g)?"checked":""}/>${g}</label>`).join("")}
          </div>
          <p class="filter-title">Prenda</p>
          <div class="filter-list">${CATEGORIES.map(c => `
            <label><input type="checkbox" data-type="category" data-value="${c}" onchange="toggleFilter('category','${c}')" ${filters.category.has(c)?"checked":""}/>${c}</label>`).join("")}
          </div>
          <button class="clear-filters" id="clear-filters-btn" onclick="clearFilters()">Limpiar filtros</button>
        </aside>
        <div class="catalog-results" id="catalog-results"></div>
      </div>
    </div>
  `;
}
function toggleFilters(){
  filtersVisible = !filtersVisible;
  document.getElementById("catalog-filters").classList.toggle("hidden", !filtersVisible);
}
function toggleFilter(type, value){
  const set = filters[type];
  set.has(value) ? set.delete(value) : set.add(value);
  window.history.replaceState(null, "", "#/catalogo" + serializeFilters());
  updateCatalogResults();
}
function updateCatalogResults(){
  const results = catalogResults();
  document.getElementById("catalog-count").textContent = `${results.length} ${results.length===1?"prenda":"prendas"}`;
  const activeCount = filters.gender.size + filters.category.size;
  document.getElementById("clear-filters-btn").style.display = activeCount > 0 ? "inline" : "none";
  const resultsEl = document.getElementById("catalog-results");
  resultsEl.innerHTML = results.length === 0
    ? `<p class="empty-msg">No encontramos prendas con esos filtros.</p>`
    : `<div class="grid" style="padding:0;">${results.map(productCardHTML).join("")}</div>`;
}

/* ============ RENDER: CHECKOUT ============ */
function renderCheckout(){
  const container = document.getElementById("main-content");
  const items = cartItemsArray();
  const subtotal = cartSubtotal();

  if(view !== "checkout") return;

  const existingDone = document.getElementById("checkout-done-view");
  if(existingDone) return; // stay on confirmation screen

  container.innerHTML = `
    <div class="checkout-wrap" id="checkout-form-view">
      <div class="checkout-body">
        <form class="checkout-form" id="checkout-form">
          <h3>Datos de envío</h3>
          <label class="field"><span>Nombre y apellido</span><input required name="nombre" type="text"/></label>
          <label class="field"><span>Email</span><input required name="email" type="email"/></label>
          <label class="field"><span>Dirección</span><input required name="direccion" type="text"/></label>
          <label class="field"><span>Ciudad</span><input required name="ciudad" type="text"/></label>
          <label class="field"><span>Código postal</span><input required name="cp" type="text"/></label>

          <h3>Medio de pago</h3>
          <div class="payment-note">
            <strong>Transferencia bancaria</strong> — por el momento es el único medio de pago disponible.
            Al confirmar el pedido te enviamos por correo el alias y los datos de la cuenta, y el teléfono
            del comercio para que nos mandes el comprobante.
          </div>

          <button type="submit" class="btn-pill" style="margin-top:20px;width:100%;" ${items.length===0?"disabled":""}>Confirmar compra</button>
        </form>

        <div class="checkout-summary">
          <div class="summary-card">
            <h4>Tu pedido</h4>
            ${items.length === 0
              ? `<p style="color:var(--ink-soft);font-size:14px;">No hay prendas en el carrito.</p>`
              : items.map(({p,qty}) => `
                <div class="summary-line">
                  <span>${p.name} <span class="muted">x${qty}</span></span>
                  <span>${money(p.price*qty)}</span>
                </div>`).join("")
            }
            <div class="summary-total">
              <div class="row"><span class="muted">Subtotal</span><span>${money(subtotal)}</span></div>
              <div class="row"><span class="muted">Envío</span><span>Gratis</span></div>
              <div class="row big"><span>Total</span><span>${money(subtotal)}</span></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  `;

  document.getElementById("checkout-form").onsubmit = (e) => {
    e.preventDefault();
    if(items.length === 0) return;

    const data = new FormData(e.target);
    const order = {
      number: generateOrderNumber(),
      name: data.get("nombre"),
      email: data.get("email"),
      address: data.get("direccion"),
      city: data.get("ciudad"),
      zip: data.get("cp"),
      itemsText: items.map(({p,qty}) => `${p.name} x${qty} — ${money(p.price*qty)}`).join("\n"),
      totalText: money(subtotal),
    };

    sendConfirmationEmail(order);

    container.innerHTML = `
      <div class="checkout-done" id="checkout-done-view">
        <div class="done-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M8 4 4 7v3h2v9h12v-9h2V7l-4-3-2 2h-4L8 4Z" stroke="#EFF0E9" stroke-width="1.2" stroke-linejoin="round"/></svg>
        </div>
        <h2>Compra confirmada</h2>
        <p>Pedido #${order.number} · Te enviamos un correo a ${order.email} con este detalle.</p>
        <div class="bank-info-card">
          <p class="bank-info-title">Datos para transferir</p>
          <div class="bank-row"><span>Titular</span><span>${BANK_INFO.titular}</span></div>
          <div class="bank-row"><span>Banco</span><span>${BANK_INFO.banco}</span></div>
          <div class="bank-row"><span>Alias</span><span>${BANK_INFO.alias}</span></div>
          <div class="bank-row"><span>CBU</span><span>${BANK_INFO.cbu}</span></div>
          <div class="bank-row"><span>Total a transferir</span><span>${order.totalText}</span></div>
        </div>
        <p class="phone-note">Una vez hecha la transferencia, mandanos el comprobante al ${STORE_PHONE}.</p>
        <button class="btn-pill" onclick="goView('home')">Volver a la tienda</button>
      </div>
    `;

    cart = {};
    refreshCartUI();
  };
}

/* ============ RENDER: PRODUCT DETAIL ============ */
function renderProduct(id){
  const p = findProduct(id);
  if(!p) return `<p class="empty-msg">No encontramos esa prenda.</p>`;
  return `
    <div class="detail-wrap">
      <div class="detail-image-col">
        <div class="detail-image-frame">
          <div class="detail-image" style="background-color:var(--sw-${p.tone})">
            <div style="opacity:0.55;">${shirtSVG(p.tone).replace('width="44" height="44"','width="90" height="90"')}</div>
          </div>
        </div>
      </div>
      <div class="detail-info-col">
        <p class="detail-meta">${p.gender.toUpperCase()} · ${p.category.toUpperCase()}</p>
        <h1 class="detail-name">${p.name}</h1>
        <p class="detail-price">${money(p.price)}</p>
        <p class="detail-desc">Pieza seleccionada de nuestra colección ${p.gender.toLowerCase()}, en tono ${TONE_LABEL[p.tone]}. Corte clásico y terminaciones prolijas, pensada para durar temporada tras temporada.</p>
        <button class="btn-pill detail-add-btn" onclick="addToCart(${p.id})">Agregar al carrito</button>
      </div>
    </div>
  `;
}

/* ============ MASTER RENDER ============ */
function render(){
  const main = document.getElementById("main-content");
  const sub = document.getElementById("subheader");
  const subTitle = document.getElementById("subheader-title");
  const titles = { catalog:"Catálogo", checkout:"Finalizar compra" };

  if(view === "home"){
    sub.classList.remove("show");
    main.innerHTML = renderHome();
  } else if(view === "catalog"){
    sub.classList.add("show");
    subTitle.textContent = titles.catalog;
    main.innerHTML = renderCatalog();
    document.getElementById("catalog-filters").classList.toggle("hidden", !filtersVisible);
    updateCatalogResults();
  } else if(view === "checkout"){
    sub.classList.add("show");
    subTitle.textContent = titles.checkout;
    main.innerHTML = "";
    renderCheckout();
  } else if(view === "product"){
    sub.classList.add("show");
    const p = findProduct(currentProductId);
    subTitle.textContent = p ? p.name : "Prenda";
    main.innerHTML = renderProduct(currentProductId);
  }
}

/* ============ INIT ============ */
renderMenuLists();
window.addEventListener("hashchange", handleHashChange);
handleHashChange();
refreshCartUI();
</script>
